[package]
name="vestacraft-cli"
version="0.1.0"
edition="2024"
[[bin]]
name="vestacraft-cli"
path="src/main.rs"
[dependencies]
vesta-model={path="../../crates/model"}
vesta-commands={path="../../crates/commands"}
vesta-codecs={path="../../crates/codecs"}
vesta-bindings={path="../../crates/bindings"}
serde_json="=1.0.145"
craft = { workspace = true, features = ["jsonrpc", "mime"] }

[dev-dependencies]
craft-testkit.workspace = true
